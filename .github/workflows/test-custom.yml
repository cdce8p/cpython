name: Test custom changes

on:
  push:

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-26.04
    env:
      FORCE_COLOR: 1
    steps:
      - uses: actions/checkout@v7
      - name: Configure CPython
        run: ./configure CFLAGS="-Wno-unreachable-code-fallthrough"
      - name: Run regen
        run: |
          make regen-token
          make regen-keyword
          make regen-ast
          make regen-pegen
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "--"
            echo "Changes detected after regen"
            git status --porcelain --untracked-files=no
            exit 1
          fi
      - name: Build CPython
        run: make -j4 -s
      - name: Run ast + syntax tests
        run: |
          ./python -m test \
            test_ast test_grammar test_syntax test_patma \
            test_unparse test_future_stmt.test_future
